[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KerGameAIEngine Team"]
license = "MIT"

[workspace.dependencies]
# Core engine deps
wgpu = "22.1"
winit = "0.30"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"

# ECS
hecs = "0.10"

# Seeded RNG
rand = "0.8"
rand_chacha = "0.3"

# Serialization for commands/replay
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Math
glam = "0.29"

# Hashing for replay verification
sha2 = "0.10"
